<section
    class="min-h-[calc(100vh-var(--spacing-header))] container flex items-center justify-center bg-white selection:bg-black selection:text-white">
    <div class="w-full flex justify-center">
        <div class="w-full max-w-110">
            <h1 class="text-center font-serif text-3xl font-bold tracking-[0.3em] uppercase mb-12 select-none">
                TNB.Studio
            </h1>

            <div class="mb-10">
                <h2 class="font-serif text-2xl font-normal tracking-wide mb-2">{{'FORGOT_PASSWORD.TITLE' | translate}}
                </h2>
                <p class="text-xs tracking-wider text-neutral-500 uppercase">{{'FORGOT_PASSWORD.DESC' | translate}}</p>
            </div>

            @if (showAlert()) {
            <div class="flex mb-6 items-center gap-2 py-3 px-4 border border-blue-200 text-blue-700/90 bg-blue-50">
                <i class="ti ti-info-circle text-[24px]"></i>
                <p class="text-xs">{{'FORGOT_PASSWORD.ALERT' | translate}}</p>
            </div>
            }

            <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-6">
                <!-- Email -->
                <div class="space-y-2 text-left">
                    <label for="email" class="text-[11px] font-bold uppercase tracking-[0.15em]">{{'AUTH.EMAIL_LABEL' |
                        translate}}</label>
                    <app-input [placeholder]="'name@example.com'" [type]="'email'" [autocomplete]="'email'"
                        [id]="'email'" formControlName="email"
                        [customErrorMessages]="{pattern: 'VALIDATION.EMAIL_INVALID'}"></app-input>
                </div>

                <!-- Submit button -->
                <button type="submit" [disabled]="forgotPasswordForm.invalid || isLoading()"
                    class="w-full py-4 px-4 bg-black hover:bg-white text-white hover:text-black rounded-none border border-black text-xs font-bold uppercase tracking-[0.2em] transition-all duration-300 disabled:opacity-40 disabled:hover:bg-black disabled:hover:text-white disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    @if (isLoading()) {
                    <div class="w-4 h-4 border border-current border-t-transparent rounded-full animate-spin"></div>
                    } @else {
                    <span>{{'FORGOT_PASSWORD.SUBMIT_BTN' | translate}}</span>
                    }
                </button>
            </form>
        </div>
    </div>
</section>
