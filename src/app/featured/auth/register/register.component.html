<section
    class="min-h-[calc(100vh-var(--spacing-header))] container flex items-center justify-center bg-white selection:bg-black selection:text-white">
    <div class="w-full flex justify-center">
        <div class="w-full max-w-110 py-12">
            <!-- Brand Logo Cổ Điển -->
            <h1 class="text-center font-serif text-3xl font-bold tracking-[0.3em] uppercase mb-12 select-none">
                TNB.Studio
            </h1>

            <!-- Tiêu đề Form -->
            <div class="mb-10">
                <h2 class="font-serif text-2xl font-normal tracking-wide mb-2">{{'AUTH.REGISTER.TITLE' | translate}}
                </h2>
                <p class="text-xs tracking-wider text-neutral-500 uppercase">{{'AUTH.REGISTER.DESC' | translate}}</p>
            </div>

            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
                <!-- Full Name -->
                <div class="space-y-2">
                    <label for="fullname"
                        class="font-sans text-[11px] font-bold uppercase tracking-[0.15em]">{{'AUTH.FULL_NAME' |
                        translate}}</label>
                    <app-input [placeholder]="'Nguyen Van A'" [id]="'fullname'" formControlName="fullName"
                        [autocomplete]="'fullname'"
                        [customErrorMessages]="{ pattern: 'VALIDATION.FULLNAME_PATTERN' }"></app-input>
                </div>

                <!--Email -->
                <div class="space-y-2">
                    <label for="email"
                        class="font-sans text-[11px] font-bold uppercase tracking-[0.15em]">{{'AUTH.EMAIL_LABEL' |
                        translate}}</label>
                    <app-input [type]="'email'" [placeholder]="'name@example.com'" [id]="'email'"
                        formControlName="email" [autocomplete]="'email'"
                        [customErrorMessages]="{pattern: 'VALIDATION.EMAIL_INVALID'}"></app-input>
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <label class="font-sans text-[11px] font-bold uppercase tracking-[0.15em]">{{'AUTH.PASSWORD' |
                        translate}}</label>
                    <app-input [type]="'password'" [placeholder]="'••••••••'" [id]="'password'"
                        [autocomplete]="'current-password'" formControlName="password"
                        [customErrorMessages]="{pattern: 'VALIDATION.PASSWORD_PATTERN'}"></app-input>
                </div>

                <!-- Confirm password -->
                <div class="space-y-2">
                    <label class="font-sans text-[11px] font-bold uppercase tracking-[0.15em]">{{'AUTH.CONFIRM_PASSWORD'
                        | translate}}</label>
                    <app-input [type]="'password'" [placeholder]="'••••••••'" [id]="'confirm-password'"
                        [autocomplete]="'current-password'" formControlName="confirmPassword"
                        [externalErrors]="registerForm.hasError('passwordMismatch') ? { passwordMismatch: true } : null"></app-input>
                </div>

                <!-- Legal agreement -->
                <div class="flex items-start gap-3 pt-2">
                    <input type="checkbox" formControlName="agreeTerms" id="agreeTerms"
                        class="accent-black h-4 w-4 rounded-none border-neutral-200 mt-0.5" />
                    <label auto-focused for="agreeTerms" class="font-sans text-xs text-neutral-500 leading-relaxed">
                        {{'AUTH.LEGAL.AGREEMENT_PREFIX' | translate}} <a href="#"
                            class="underline underline-offset-2 text-black">{{'AUTH.LEGAL.TOS_TITLE' | translate}}</a>
                        {{'AUTH.LEGAL.AGREEMENT_AND' | translate}} <a href="#"
                            class="underline underline-offset-2 text-black">{{'AUTH.LEGAL.PRIVACY_TITLE' |
                            translate}}</a>
                    </label>
                </div>

                <!-- Submit button -->
                <button type="submit" [disabled]="registerForm.invalid || registerForm.pending || isLoading()"
                    class="w-full py-4 px-4 bg-black hover:bg-white text-white hover:text-black rounded-none border border-black font-sans text-xs font-bold uppercase tracking-[0.2em] transition-all duration-300 disabled:opacity-40 disabled:hover:bg-black disabled:hover:text-white disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    @if (isLoading()) {
                    <div class="w-4 h-4 border border-current border-t-transparent rounded-full animate-spin"></div>
                    } @else {
                    <span>{{'AUTH.REGISTER.SUBMIT_BTN' | translate}}</span>
                    }
                </button>
            </form>

            <!-- Line -->
            <div class="relative flex items-center justify-center my-10">
                <div class="absolute w-full border-t border-neutral-100"></div>
                <span
                    class="relative bg-white px-4 font-sans text-[10px] text-neutral-400 uppercase tracking-[0.2em]">{{'COMMON.OR'
                    | translate}}</span>
            </div>

            <!-- Login with google -->
            <button type="button"
                class="w-full py-3.5 border border-neutral-200 rounded-none bg-white font-sans text-xs font-semibold uppercase tracking-wider hover:border-black transition-colors flex items-center justify-center gap-3">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="currentColor"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path fill="currentColor"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path fill="currentColor"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                        fill="#FBBC05" />
                    <path fill="currentColor"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                {{'AUTH.REGISTER.GOOGLE_BTN' | translate}}
            </button>

            <!-- Back to login  -->
            <div class="mt-12 text-center font-sans text-xs tracking-wide text-neutral-500">
                {{'AUTH.REGISTER.FOOTER' | translate}}?
                <a routerLink="/auth/login"
                    class="font-semibold underline underline-offset-4 hover:text-black transition-colors ml-1">{{'AUTH.SIGN_IN'
                    | translate}}</a>
            </div>
        </div>
    </div>

</section>
