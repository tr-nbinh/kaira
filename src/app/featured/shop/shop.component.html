<section class="bg-white pt-section-tight pb-section-compact">
    <div class="container">
        <!-- Breadcrumb -->

        <!-- Hero -->
        <header class="mb-20">
            <app-breadcrumb [items]="breadcrumbItems" />

            <div class="mt-8">
                <app-shop-hero />
            </div>
        </header>

        <!-- Toolbar -->
        <div class="mb-12">
            <app-shop-toolbar [totalProducts]="pagination().totalCount" [gridView]="gridView()"
                (gridViewChange)="gridView.set($event)" (filterClick)="openFilterDrawer()" />
        </div>

        <!-- Product Grid -->
        <app-shop-product-grid [products]="products()" [gridView]="gridView()"
            [loading]="productResource.isLoading()" />

        <!-- Load More -->
        @if(products().length) {
        <section class="mt-24 text-center">
            <button type="button" (click)="loadMore()"
                class="border border-black px-12 py-5 text-[11px] uppercase tracking-[0.25em] transition duration-300 hover:bg-black hover:text-white">
                Load More
            </button>
        </section>
        }
    </div>
</section>
