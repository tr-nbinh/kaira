<section class="grid grid-cols-1 gap-12 border-t border-black pt-8 lg:grid-cols-2 lg:gap-0 lg:pt-0 animate-pulse">
    <!-- LEFT COLUMN SKELETON (Danh sách sản phẩm) -->
    <div class="order-2 flex flex-col justify-center lg:order-1 lg:border-r lg:border-neutral-100 lg:py-12 lg:pr-12">
        <ul class="divide-y divide-neutral-100">
            <!-- Giả lập 3 dòng sản phẩm đang loading -->
            @for (skele of [1, 2, 3, 5, 6, 7, 8]; track skele) {
            <li>
                <div class="py-5">
                    <div class="flex items-start justify-between gap-4 pe-2">
                        <div class="flex flex-1 items-start gap-4 md:gap-6">
                            <!-- Số thứ tự giả lập -->
                            <div class="h-3 w-4 bg-neutral-200 rounded pt-1 mt-1"></div>

                            <div class="flex-1 space-y-2.5">
                                <!-- Tên sản phẩm giả lập -->
                                <div class="h-4 w-3/4 bg-neutral-200 rounded lg:h-6"></div>
                                <!-- Variant Summary giả lập -->
                                <div class="h-3 w-1/2 bg-neutral-200 rounded"></div>
                                <!-- Giá tiền giả lập (Chỉ hiện ở Mobile) -->
                                <div class="h-3.5 w-1/4 bg-neutral-200 rounded lg:hidden mt-2"></div>
                            </div>
                        </div>

                        <!-- Nút xóa giả lập -->
                        <div class="h-8 w-8 bg-neutral-200 rounded-full"></div>
                    </div>
                </div>
            </li>
            }
        </ul>
    </div>

    <!-- DESKTOP PREVIEW SKELETON (Cột ảnh bên phải) -->
    <div
        class="sticky top-28 order-1 hidden min-h-165 items-center justify-center bg-neutral-50 p-12 lg:flex lg:order-2">
        <div class="w-full max-w-85">
            <!-- Khung ảnh giả lập (Tỷ lệ aspect-3/4 chuẩn cấu trúc của bạn) -->
            <div class="mb-2 aspect-3/4 w-full bg-neutral-200 border border-neutral-100 shadow-xl"></div>

            <!-- Khối thông tin chi tiết giả lập dưới ảnh -->
            <div class="border border-neutral-100 bg-white p-5 shadow-sm space-y-4">
                <!-- Tên sản phẩm chính -->
                <div class="h-4 w-2/3 bg-neutral-200 rounded mx-auto"></div>
                <!-- Variant summary -->
                <div class="h-3 w-1/2 bg-neutral-200 rounded mx-auto"></div>
                <!-- Giá tiền -->
                <div class="h-4 w-1/3 bg-neutral-200 rounded mx-auto mt-2"></div>
                <!-- Nút Thêm vào giỏ hàng giả lập -->
                <div class="h-11 w-full bg-neutral-200 rounded mt-5"></div>
            </div>
        </div>
    </div>
</section>
