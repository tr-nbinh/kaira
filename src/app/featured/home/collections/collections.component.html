<section aria-labelledby="collections-heading" class="bg-white py-section-compact">
    <div class="container">
        <!-- Header -->
        <app-section-header [title]="'COLLECTIONS.TITLE' | translate" [subtitle]="'COLLECTIONS.SUBTITLE' | translate" />

        <!-- Layout -->
        <div class="grid gap-6 lg:h-212.5 lg:grid-cols-12">
            <!-- FEATURED -->
            <article class="group min-h-125 lg:col-span-7 lg:h-full"
                aria-labelledby="'collection-title-' + featuredCollection.id">
                <a [routerLink]="['/collections', featuredCollection.slug]"
                    class="block h-full focus:outline-none focus-visible:ring-2 focus-visible:ring-black focus-visible:ring-offset-4">
                    <div class="relative h-full overflow-hidden">
                        <!-- Image -->
                        <img [src]="featuredCollection.image" [alt]="featuredCollection.name" loading="lazy"
                            class="absolute inset-0 h-full w-full object-cover transition-transform duration-700 group-hover:scale-105" />

                        <!-- Overlay -->
                        <div class="absolute inset-0 bg-black/30 transition group-hover:bg-black/40"></div>

                        <!-- Content -->
                        <div class="absolute inset-0 flex flex-col justify-end p-8 text-white md:p-12">
                            <h3 [id]="
                                    'collection-title-' + featuredCollection.id
                                " class="text-4xl font-medium uppercase tracking-[0.15em] md:text-5xl">
                                {{ featuredCollection.name }}
                            </h3>

                            <p class="mt-4 max-w-md text-sm text-white/90">
                                {{ featuredCollection.description }}
                            </p>

                            <span class="mt-6 inline-flex items-center gap-2 text-sm uppercase tracking-[0.2em]">
                                {{'COLLECTIONS.EXPLORE_COLLECTION' | translate}}
                                <span aria-hidden="true">→</span>
                            </span>
                        </div>
                    </div>
                </a>
            </article>

            <!-- RIGHT SIDE -->
            <div class="flex flex-col gap-6 lg:col-span-5 lg:h-full">
                @for (collection of secondaryCollections; track collection.id) {
                <article class="group flex-1" [attr.aria-labelledby]="
                            'collection-title-' + collection.id
                        ">
                    <a [routerLink]="['/collections', collection.slug]"
                        class="block h-full focus:outline-none focus-visible:ring-2 focus-visible:ring-black focus-visible:ring-offset-4">
                        <div class="relative h-full min-h-65 overflow-hidden">
                            <!-- Image -->
                            <img [src]="collection.image" [alt]="collection.name" loading="lazy"
                                class="absolute inset-0 h-full w-full object-cover transition-transform duration-700 group-hover:scale-105" />

                            <!-- Overlay -->
                            <div class="absolute inset-0 bg-black/35 transition group-hover:bg-black/45"></div>

                            <!-- Content -->
                            <div class="absolute inset-0 flex flex-col justify-end p-6 text-white">
                                <h3 [id]="
                                            'collection-title-' + collection.id
                                        " class="text-xl font-medium uppercase tracking-[0.15em]">
                                    {{ collection.name }}
                                </h3>

                                <p class="mt-2 text-xs text-white/80">
                                    {{ collection.description }}
                                </p>

                                <span class="mt-4 inline-flex items-center gap-2 text-xs uppercase tracking-[0.2em]">
                                    {{'COLLECTIONS.EXPLORE' | translate}}
                                    <span aria-hidden="true">→</span>
                                </span>
                            </div>
                        </div>
                    </a>
                </article>
                }
            </div>
        </div>
    </div>
</section>
