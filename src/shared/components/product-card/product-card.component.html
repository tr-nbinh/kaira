<article class="group" [attr.aria-labelledby]="'product-title-' + product().id">
    <div class="relative overflow-hidden">
        <a [routerLink]="product() | productUrl"
            class="block focus:outline-none focus-visible:ring-2 focus-visible:ring-black focus-visible:ring-offset-4">
            <app-image-hover [primary]="product().primaryImageUrl" [secondary]="product().secondImageUrl"
                [alt]="product().name" />
        </a>

        <!-- Best Seller -->
        @if (product().isBestSeller) {
        <span
            class="absolute left-4 top-4 border border-black bg-white px-3 py-1 text-[10px] uppercase tracking-[0.2em]">
            {{ "BEST_SELLERS.TAG" | translate }}
        </span>
        }

        <!-- Wishlist -->
        <button type="button" aria-label="Wishlist" class="absolute top-4 right-4 flex h-10 w-10 items-center justify-center rounded-full bg-white/60 shadow-sm 
            transition duration-300 opacity-100 lg:opacity-0 lg:group-hover:opacity-100 hover:bg-white"
            (click)="toggleWishlist($event)">
            @if (product().isWishlisted) {
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"
                class="icon icon-tabler icons-tabler-filled icon-tabler-heart">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path
                    d="M6.979 3.074a6 6 0 0 1 4.988 1.425l.037 .033l.034 -.03a6 6 0 0 1 4.733 -1.44l.246 .036a6 6 0 0 1 3.364 10.008l-.18 .185l-.048 .041l-7.45 7.379a1 1 0 0 1 -1.313 .082l-.094 -.082l-7.493 -7.422a6 6 0 0 1 3.176 -10.215z" />
            </svg>
            } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-heart">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572" />
            </svg>
            }
        </button>

        <!-- Mobile / Tablet -->
        <button type="button" (click)="openQuickView($event)" [attr.aria-label]="'Quick view ' + product().name"
            class="absolute bottom-4 right-4 flex h-10 w-10 items-center justify-center rounded-full bg-white/60 shadow-sm transition lg:hidden">
            <i class="ti ti-eye text-lg"></i>
        </button>

        <!-- Desktop -->
        <button type="button" (click)="openQuickView($event)" [attr.aria-label]="'Quick view ' + product().name"
            class="absolute inset-x-0 bottom-0 hidden translate-y-full bg-black py-4 text-center text-xs uppercase tracking-[0.2em] text-white transition-transform duration-300 lg:block lg:group-hover:translate-y-0">
            {{ "BEST_SELLERS.QUICK_VIEW" | translate }}
        </button>
    </div>

    <a [routerLink]="product() | productUrl" class="mt-5 block">
        <h3 [id]="'product-title-' + product().id" class="text-sm uppercase tracking-[0.12em]">
            {{ product().name }}
        </h3>

        <div class="mt-2 flex items-center gap-3">
            @if (product().compareAtPrice) {
            <span class="text-sm font-medium">
                {{ product().price | price: product().currency }}
            </span>

            <span class="text-sm text-neutral-400 line-through">
                {{ product().compareAtPrice! | price: product().currency }}
            </span>
            } @else {
            <span class="text-sm text-neutral-700">
                {{ product().price | price: product().currency }}
            </span>
            }
        </div>
    </a>
</article>
