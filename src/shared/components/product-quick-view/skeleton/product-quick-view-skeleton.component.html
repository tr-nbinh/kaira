<article class="flex w-full bg-white animate-pulse">
    <div class="grid w-full grid-cols-1 lg:grid-cols-[48%_52%]">
        <figure class="border-b border-neutral-100 flex flex-col">
            <div class="w-full h-75 flex items-center justify-center overflow-hidden bg-neutral-100">
                <div class="w-full h-full bg-neutral-200"></div>
            </div>

            <div class="hidden md:flex gap-3 p-4 justify-start border-t border-neutral-100 bg-white">
                @for (item of [1, 2, 3, 4]; track $index) {
                <div class="w-16 h-20 bg-neutral-200 border border-neutral-100"></div>
                }
            </div>

            <div class="flex justify-center gap-2 py-3 md:hidden bg-white">
                <div class="h-2 w-6 bg-neutral-300 rounded-full"></div>
                <div class="h-2 w-2 bg-neutral-200 rounded-full"></div>
                <div class="h-2 w-2 bg-neutral-200 rounded-full"></div>
            </div>
        </figure>

        <section class="flex flex-col p-5 sm:p-6 lg:p-8 min-w-0 justify-between md:border-l border-neutral-100">
            <div class="space-y-6 flex-1 max-w-130 w-full">
                <header class="space-y-2">
                    <div class="h-3 w-24 bg-neutral-200 rounded"></div>

                    <div class="h-7 w-3/4 bg-neutral-200 rounded mt-2"></div>
                    <div class="h-7 w-1/2 bg-neutral-200 rounded"></div>

                    <div class="h-3 w-20 bg-neutral-200 rounded mt-2"></div>

                    <div class="mt-4 flex items-center gap-2">
                        <div class="h-4 w-24 bg-neutral-200 rounded"></div>
                        <div class="h-3 w-16 bg-neutral-100 rounded"></div>
                    </div>

                    <div class="mt-5 flex items-end gap-3">
                        <div class="h-8 w-20 bg-neutral-200 rounded"></div>
                        <div class="h-5 w-14 bg-neutral-100 rounded"></div>
                    </div>
                </header>

                <section class="space-y-3">
                    <div class="h-3 w-24 bg-neutral-200 rounded"></div>
                    <div class="space-y-2 pt-1">
                        <div class="h-3 w-full bg-neutral-100 rounded"></div>
                        <div class="h-3 w-full bg-neutral-100 rounded"></div>
                        <div class="h-3 w-2/3 bg-neutral-100 rounded"></div>
                    </div>
                </section>

                <div class="space-y-6 border-t border-neutral-100 pt-5">
                    <div class="space-y-3">
                        <div class="h-3 w-16 bg-neutral-200 rounded"></div>
                        <div class="h-4 w-12 bg-neutral-100 rounded"></div>
                        <div class="flex gap-2">
                            <div class="h-6 w-6 rounded-full bg-neutral-200"></div>
                            <div class="h-6 w-6 rounded-full bg-neutral-200"></div>
                            <div class="h-6 w-6 rounded-full bg-neutral-200"></div>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="h-3 w-16 bg-neutral-200 rounded"></div>
                        <div class="flex gap-2">
                            <div class="h-9 w-12 bg-neutral-100 rounded"></div>
                            <div class="h-9 w-12 bg-neutral-100 rounded"></div>
                            <div class="h-9 w-12 bg-neutral-100 rounded"></div>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="h-3 w-16 bg-neutral-200 rounded"></div>
                        <div class="h-9 w-28 bg-neutral-100 rounded"></div>
                    </div>
                </div>
            </div>

            <div class="pt-5 border-t border-neutral-100 w-full space-y-3">
                <div class="w-full h-11 bg-neutral-200 rounded"></div>
                <div class="w-full h-11 bg-neutral-100 rounded"></div>

                <footer class="flex items-center justify-between pt-4 border-t border-neutral-100">
                    <div class="h-3 w-20 bg-neutral-100 rounded"></div>
                    <div class="h-3 w-24 bg-neutral-100 rounded"></div>
                </footer>
            </div>
        </section>
    </div>
</article>
